[project]
name = "mia"
version = "0.1.0"
description = "Market Gap Scout: SaaS competitor intelligence and market-gap agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ddgs>=9.16.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "torch>=2.4",
    "typer>=0.12",
]

[project.scripts]
mia = "mia.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia"]

# CPU-only PyTorch. Without this, Linux installs the multi-GB CUDA build.
# torch must stay a direct dependency for this source to apply.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # keep ruff away from code blocks in SPEC.md

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access or API keys (skipped by default and in CI)"]
addopts = "-m 'not network'"
