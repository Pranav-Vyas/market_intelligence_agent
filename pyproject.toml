[project]
name = "mia"
version = "0.1.0"
description = "Market Gap Scout: SaaS competitor intelligence and market-gap agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "ddgs>=9.16.0",
    "fastembed>=0.9.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "numpy>=2.5.3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "trafilatura>=2.3.1",
    "typer>=0.12",
]

[project.scripts]
mia = "mia.cli:app"

[project.optional-dependencies]
browser = [
    "playwright>=1.63.0",
]
ui = [
    "plotly>=7.1.0",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # keep ruff away from code blocks in SPEC.md

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access or API keys (skipped by default and in CI)"]
addopts = "-m 'not network'"
