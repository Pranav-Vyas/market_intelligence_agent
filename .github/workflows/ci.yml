name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies (with the ui extra, so the Streamlit app is tested too)
        run: uv sync --locked --extra ui
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (network tests are skipped)
        run: uv run pytest
